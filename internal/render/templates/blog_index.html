{{define "blog_index-content"}}
<article class="page">
  <h1>{{t "blog.title"}}</h1>
  {{if not .Posts}}
    <p>{{t "blog.empty"}}</p>
  {{else}}
    <ul class="post-list">
      {{range .Posts}}
      <li>
        <a href="/{{$.Lang}}/blog/{{.Slug}}">
          <span class="post-title">{{.Title}}</span>
          <span class="post-meta">{{.Date.Format "2006-01-02"}}{{if .Author}} · {{.Author}}{{end}}</span>
        </a>
        {{if .Description}}<p>{{.Description}}</p>{{end}}
      </li>
      {{end}}
    </ul>
  {{end}}
</article>
{{end}}
