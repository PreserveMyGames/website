name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Block untrusted CI surface changes
        if: github.event.pull_request.head.repo.fork == false
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          SAFE_TO_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'safe-to-test') }}
        run: |
          set -euo pipefail
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              exit 0
              ;;
          esac
          if [ "$SAFE_TO_TEST" = "true" ]; then
            echo "Maintainer marked safe-to-test after review"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows \
            Makefile \
            scripts \
            docker/Dockerfile \
            docker/docker-compose.yml)"
          if [ -n "$changed" ]; then
            echo "::error::Changes to CI or build files require a maintainer or the safe-to-test label after manual review."
            printf '%s\n' "$changed"
            exit 1
          fi

  test:
    needs: policy
    if: always() && (github.event_name == 'push' || needs.policy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI
        run: make ci

      - name: Race detector
        run: make test-race

  docker:
    needs: policy
    if: always() && (github.event_name == 'push' || needs.policy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true

      - name: Smoke test compose
        run: make docker-test && make docker-down
